<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kindle AI Quota Dashboard</title>
<style>
:root {
  --bg: #FFFFFF; --fg: #000000; --mid: #444444; --light: #666666;
  --faint: #999999; --border: #AAAAAA; --border-light: #CCCCCC;
  --bar-bg: #DDDDDD; --bar-fill: #333333; --card-bg: #F8F8F8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181818; --fg: #E0E0E0; --mid: #AAAAAA; --light: #777777;
    --faint: #444444; --border: #333333; --border-light: #282828;
    --bar-bg: #2A2A2A; --bar-fill: #AAAAAA; --card-bg: #1E1E1E;
  }
}
:root[data-theme="dark"] {
  --bg: #181818; --fg: #E0E0E0; --mid: #AAAAAA; --light: #777777;
  --faint: #444444; --border: #333333; --border-light: #282828;
  --bar-bg: #2A2A2A; --bar-fill: #AAAAAA; --card-bg: #1E1E1E;
}
:root[data-theme="light"] {
  --bg: #FFFFFF; --fg: #000000; --mid: #444444; --light: #666666;
  --faint: #999999; --border: #AAAAAA; --border-light: #CCCCCC;
  --bar-bg: #DDDDDD; --bar-fill: #333333; --card-bg: #F8F8F8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: Georgia, 'Noto Serif SC', 'SimSun', serif;
  background: var(--bg); color: var(--fg);
  width: 600px; height: 800px; overflow: hidden;
  padding: 24px 24px 16px; display: flex; flex-direction: column;
}
.sans { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif; }
.mono { font-family: 'Consolas', 'Courier New', monospace; font-variant-numeric: tabular-nums; }

/* ===== Top: DateTime + Weather ===== */
.top-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  margin-bottom: 20px;
}
.weather-card, .datetime-card {
  background: var(--card-bg); border: 1px solid var(--border-light); padding: 14px 16px;
}

/* DateTime card */
.dt-time { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
.dt-meta { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.dt-date { font-size: 15px; color: var(--mid); }
.dt-week { font-size: 14px; color: var(--light); }
.dt-battery { font-size: 13px; color: var(--light); margin-top: 6px; display: flex; align-items: center; gap: 4px; }
.dt-battery svg { width: 16px; height: 12px; }

/* Weather card */
.w-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.w-temp { font-size: 40px; font-weight: 700; line-height: 1; }
.w-icon { color: var(--mid); }
.w-icon svg { width: 30px; height: 30px; }
.w-detail { font-size: 13px; color: var(--light); line-height: 1.7; }

/* ===== Quote ===== */
.quote {
  text-align: center; padding: 16px 24px;
  border: 1px solid var(--border-light); position: relative;
  margin-bottom: 20px;
}
.quote::before, .quote::after {
  position: absolute; font-size: 28px; color: var(--faint); font-family: Georgia, serif; line-height: 1;
}
.quote::before { content: '\201C'; top: 6px; left: 12px; }
.quote::after { content: '\201D'; bottom: 2px; right: 12px; }
.quote-text { font-size: 19px; line-height: 1.8; font-style: italic; margin-bottom: 4px; }
.quote-src { font-size: 12px; color: var(--light); letter-spacing: 0.05em; }

/* ===== Quota cards ===== */
.quota-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px;
  flex: 1;
}
.q-card {
  background: var(--card-bg); border: 1px solid var(--border-light);
  padding: 12px 14px; display: flex; flex-direction: column;
}
.q-head {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
}
.q-head svg { width: 20px; height: 20px; flex-shrink: 0; }
.q-name { font-size: 17px; font-weight: 600; }
.metric-value { font-size: 31px; font-weight: 700; line-height: 1.05; margin: 5px 0 8px; }
.metric-value.small { font-size: 22px; }
.metric-detail { margin-top: auto; color: var(--light); font-size: 11px; line-height: 1.5; }
.metric-bar { height: 8px; background: var(--bar-bg); width: 100%; margin-bottom: 8px; }
.metric-bar-fill { height: 100%; background: var(--bar-fill); }
.status-dot { display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-radius: 50%; margin-right: 7px; }
.status-dot.on { background: currentColor; }

/* Single bar row */
.q-row { margin-bottom: 8px; }
.q-row:last-child { margin-bottom: 0; }
.q-label {
  display: flex; justify-content: space-between; margin-bottom: 3px;
  font-size: 11px; color: var(--light); letter-spacing: 0.06em;
}
.q-label .q-pct { color: var(--mid); font-size: 13px; font-weight: 600; }
.q-bar { height: 8px; background: var(--bar-bg); width: 100%; }
.q-bar-fill { height: 100%; background: var(--bar-fill); }
.q-refresh { font-size: 11px; color: var(--faint); margin-top: 2px; letter-spacing: 0.03em; }

/* DeepSeek balance */
.q-balance { font-size: 24px; font-weight: 700; margin: 6px 0 4px; }
.q-balance-unit { font-size: 12px; font-weight: 400; color: var(--light); }
.q-balance-sub { font-size: 11px; color: var(--faint); }

/* ===== Footer ===== */
.footer {
  margin-top: 16px; display: flex; justify-content: space-between; align-items: center;
  padding-top: 8px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--light);
}
.data-alert {
  display: none; margin: -10px 0 12px; padding: 6px 10px;
  border: 2px solid #000; text-align: center;
  font: 700 13px/1.3 Arial, 'Microsoft YaHei', sans-serif;
  color: #000; background: #fff;
}
.data-alert.on { display: block; }
.footer .warn { color: #000; font-weight: 700; }
</style>
</head>
<body>

<!-- ===== Top: DateTime + Weather ===== -->
<div class="top-row">
  <div class="datetime-card">
    <div class="dt-time mono" id="dtTime">--:--</div>
    <div class="dt-meta">
      <span class="dt-date sans" id="dtDate">----年--月--日</span>
      <span class="dt-week sans" id="dtWeek">---</span>
    </div>
    <div class="dt-battery sans" id="dtBattery">
      <svg viewBox="-0.5 0 28 14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="0" y="1" width="22" height="12" rx="2"/><rect x="22" y="4" width="3" height="6" rx="1"/><rect x="2" y="3" width="11" height="8" fill="currentColor" stroke="none" id="batFill"/></svg>
      <span id="batPct">--%</span>
    </div>
  </div>

  <div class="weather-card">
    <div class="w-row">
      <span class="w-temp" id="weatherTemp">25°</span>
      <span class="w-icon" id="weatherIcon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30"><path fill="currentColor" d="M3.89 17.6c0-.99.31-1.88.93-2.65s1.41-1.27 2.38-1.49c.26-1.17.85-2.14 1.78-2.88c.93-.75 2-1.12 3.22-1.12c1.18 0 2.24.36 3.16 1.09c.93.73 1.53 1.66 1.8 2.8h.27c1.18 0 2.18.41 3.01 1.24s1.25 1.83 1.25 3c0 1.18-.42 2.18-1.25 3.01s-1.83 1.25-3.01 1.25H8.16c-.58 0-1.13-.11-1.65-.34s-.99-.51-1.37-.89s-.68-.84-.91-1.36s-.34-1.09-.34-1.66m1.45 0c0 .76.28 1.42.82 1.96s1.21.82 1.99.82h9.28c.77 0 1.44-.27 1.99-.82s.83-1.2.83-1.96s-.27-1.42-.83-1.96c-.55-.54-1.21-.82-1.99-.82h-1.39q-.15 0-.15-.15l-.07-.49c-.1-.94-.5-1.73-1.19-2.35s-1.51-.93-2.45-.93s-1.76.31-2.46.94c-.7.62-1.09 1.41-1.18 2.34l-.07.42c0 .1-.05.15-.16.15l-.45.07c-.72.06-1.32.36-1.81.89c-.46.53-.71 1.16-.71 1.89m8.85-8.72c-.1.09-.08.16.07.21c.43.19.79.37 1.08.55c.11.03.19.02.22-.03c.61-.57 1.31-.86 2.12-.86s1.5.27 2.1.81c.59.54.92 1.21.99 2l.09.64h1.42c.65 0 1.21.23 1.68.7s.7 1.02.7 1.66c0 .6-.21 1.12-.62 1.57s-.92.7-1.53.77c-.1 0-.15.05-.15.16v1.13c0 .11.05.16.15.16c1.01-.06 1.86-.46 2.55-1.19s1.04-1.6 1.04-2.6c0-1.06-.37-1.96-1.12-2.7c-.75-.75-1.65-1.12-2.7-1.12h-.15c-.26-1-.81-1.82-1.65-2.47c-.83-.65-1.77-.97-2.8-.97c-1.4-.01-2.57.52-3.49 1.58"/></svg></span>
    </div>
    <div class="w-detail sans" id="weatherDetail">体感 28° · 湿度 85%<br>风 4km/h · 北京</div>
  </div>
</div>

<div class="data-alert" id="dataAlert"></div>

<!-- ===== Quote ===== -->
<div class="quote">
  <div class="quote-text" id="quoteText">重要的东西，用眼睛是看不见的。</div>
  <div class="quote-src sans" id="quoteSrc">— 圣·埃克苏佩里 ·《小王子》</div>
</div>

<!-- ===== Codex and device metrics: top-left to bottom-right ===== -->
<div class="quota-grid">
  <div class="q-card" id="cardCodexRemaining">
    <div class="q-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/><path d="M5 5l2 2M19 5l-2 2"/></svg>
      <span class="q-name sans">Codex 剩余额度</span>
    </div>
    <div class="metric-value mono" id="codexRemaining">--%</div>
    <div class="metric-bar"><div class="metric-bar-fill" id="codexRemainingBar" style="width:0%"></div></div>
    <div class="metric-detail sans" id="codexRemainingDetail">等待 Codex 数据</div>
  </div>

  <div class="q-card" id="cardCodexReset">
    <div class="q-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 1-2.34-5.66"/><path d="M20 4v7h-7"/><path d="M12 8v4l-2 2"/></svg>
      <span class="q-name sans">下次重置时间</span>
    </div>
    <div class="metric-value small mono" id="codexReset">--月--日 --:--</div>
    <div class="metric-detail sans" id="codexResetDetail">等待重置时间</div>
  </div>

  <div class="q-card" id="cardComputer">
    <div class="q-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></svg>
      <span class="q-name sans">电脑在线状态</span>
    </div>
    <div class="metric-value sans"><span class="status-dot" id="computerDot"></span><span id="computerStatus">检测中</span></div>
    <div class="metric-detail sans" id="computerDetail">等待首次同步</div>
  </div>

  <div class="q-card" id="cardBattery">
    <div class="q-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="17" height="10" rx="2"/><path d="M20 10h2v4h-2M6 10v4M9 10v4M12 10v4"/></svg>
      <span class="q-name sans">Kindle 电量</span>
    </div>
    <div class="metric-value mono" id="batteryValue">--%</div>
    <div class="metric-bar"><div class="metric-bar-fill" id="batteryBar" style="width:0%"></div></div>
    <div class="metric-detail sans" id="batteryDetail">通过 Kindle 启动器读取</div>
  </div>
</div>

<!-- ===== Footer ===== -->
<div class="footer sans">
  <span>Kindle AI Quota Dashboard</span>
  <span id="dataStatus">等待实时数据</span>
</div>

<script src="data.js"></script>
<script src="live-endpoint.js"></script>
<script src="dashboard-runtime.js?v=20260720"></script>
</body>
</html>
